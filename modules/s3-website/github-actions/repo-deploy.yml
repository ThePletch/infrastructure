# Build site using Zola and Deploy to S3
# Configure vars.AWS_DEPLOY_ROLE_ARN with the site deploy role.
# The role must trust this repository's GitHub Actions OIDC subject on main.

name: CI

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2
      - name: Install and Run Zola
        run: |
          sudo snap install --edge zola
          zola build
      - name: Deploy to hosting S3 bucket
        uses: reggionick/s3-deploy@v3
        with:
          folder: public
          bucket: ${{ secrets.S3_BUCKET }}
          bucket-region: us-east-2
          dist-id: ${{ secrets.CLOUDFRONT_CDN_ID }}
          invalidation: '/*'
          delete-removed: true
