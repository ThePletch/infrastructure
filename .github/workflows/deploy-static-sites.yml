# Build TypeScript static sites and deploy to S3.
# Configure:
#   vars.PHOTOS_DEPLOY_ROLE_ARN
#   vars.PHOTOS_CLOUDFRONT_DISTRIBUTION_ID

name: Deploy static sites

on:
  push:
    branches: [main]
    paths:
      - "static-sites/**"
      - ".github/workflows/deploy-static-sites.yml"

permissions:
  contents: read
  id-token: write

jobs:
  photos:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: static-sites/photos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: static-sites/photos/package-lock.json
      - name: Install and build
        run: |
          npm ci
          npm run build
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.PHOTOS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - name: Deploy to hosting S3 bucket
        run: aws s3 sync dist/ s3://space.shay.zone/ --delete --exclude "photos/*"
      - name: Invalidate CloudFront
        run: >
          aws cloudfront create-invalidation
          --distribution-id ${{ vars.PHOTOS_CLOUDFRONT_DISTRIBUTION_ID }}
          --paths / /index.html /contact.html /error.html /cropped_final.png /assets/*
