<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Astrophotography by Shay Pletcher</title>
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <p class="wordmark">Shay takes space pictures</p>
      <p class="wordmark">astrophotography if you're fancy</p>
      <nav class="site-nav" aria-label="Site">
        <a href="/" aria-current="page">gallery</a>
        <a href="/contact.html">displaying my work</a>
      </nav>
      <p>i've been taking pictures of space in my backyard in boston since 2023. here's a few.</p>
    </header>
    <nav id="tags" class="tags" hidden></nav>
    <p id="status" class="status" hidden></p>
    <main id="grid" class="grid"></main>
    <nav id="pagination" class="pagination" hidden></nav>
    <dialog id="lightbox" class="lightbox">
      <div class="stage">
        <img alt="" />
        <button type="button" class="arrow prev" aria-label="Previous photo">‹</button>
        <button type="button" class="arrow next" aria-label="Next photo">›</button>
        <span class="counter"></span>
      </div>
      <aside class="panel">
        <form method="dialog">
          <button type="submit" class="icon-button close" aria-label="Close">Close <kbd>esc</kbd></button>
        </form>
        <div>
          <h2></h2>
          <p class="description"></p>
          <ul class="lightbox-tags"></ul>
        </div>
        <section class="versions" id="versions" hidden>
          <p class="panel-label"><span>Version</span><em class="versions-count"></em></p>
          <div class="version-options" role="radiogroup" aria-label="Version"></div>
        </section>
        <form class="buy" id="buy" hidden>
          <p class="panel-label"><span>Print</span></p>
          <div class="product-options" role="radiogroup" aria-label="Print type"></div>
          <p class="panel-label"><span>Size</span><em class="size-note"></em></p>
          <div class="size-options" role="radiogroup" aria-label="Size"></div>
          <div class="buy-footer">
            <button type="submit" class="buy-button"><span>Buy print</span><span class="buy-price"></span></button>
            <p class="buy-summary"></p>
            <p class="buy-status" hidden></p>
          </div>
        </form>
      </aside>
    </dialog>
    <noscript>
      <p class="status">JavaScript is required to load the gallery.</p>
    </noscript>
    <script src="/assets/main.js" defer></script>
  </body>
</html>
